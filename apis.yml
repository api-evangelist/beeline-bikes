name: Beeline Bikes
description: >-
  Beeline Bikes (now operating as Beeline Connect) is a B2B software platform for
  the bicycle industry that links riders, retailers, and brands across North
  America, with roughly 3,300 participating retailers. The platform provides
  real-time service scheduling and 24/7 appointment booking, live market inventory
  management, test-ride booking, local bicycle assembly coordination, warranty
  submission and reimbursement tracking, an affiliate e-commerce sales channel with
  revenue sharing to local dealers, and a dynamic dealer locator. It supports both
  mobile and in-shop retail operations and serves established brands such as Aventon,
  Priority, Lectric, and Pedego. The company was surfaced as a portfolio company of
  500 Global and added to the API Evangelist network. No public developer API,
  documentation, or integration surface has been found at this time.
